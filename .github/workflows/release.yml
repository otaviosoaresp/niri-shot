name: Release

on:
  push:
    branches: [master]

jobs:
  release-pr:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Install GTK 4
        if: steps.release-plz.outputs.releases_created == 'true'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - name: Build release binary
        if: steps.release-plz.outputs.releases_created == 'true'
        run: cargo build --release --locked
      - name: Upload release assets
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          tag=$(jq -r '.[0].tag' <<< "$RELEASES")
          archive=niri-shot-x86_64-linux.tar.gz
          tar -czf "$archive" -C target/release niri-shot -C "$GITHUB_WORKSPACE" README.md LICENSE
          sha256sum "$archive" > "$archive.sha256"
          gh release upload "$tag" "$archive" "$archive.sha256"
